version: "3.8"

networks:
  evolution_api_network:
    driver: bridge
    name: evolution_api_network

services:
  evolution_api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution_api_network
    env_file:
      - ./env_files/evolution_api.env
    command: ['node', './dist/src/main.js']

volumes:
  evolution_instances:
  evolution_store: