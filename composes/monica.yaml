version: "3.8"

networks:
  monica_network:
    driver: bridge
    name: monica_network

services:
  app:
    image: monica:fpm
    container_name: monica-app
    depends_on:
      - db
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=monica
      - DB_USERNAME=monica
      - DB_PASSWORD=secret
      - LOG_CHANNEL=stderr
      - CACHE_DRIVER=database
      - SESSION_DRIVER=database
      - QUEUE_DRIVER=sync
    volumes:
      - data:/var/www/html/storage
    restart: always
    networks:
      - monica_network

  web:
    build: ./web
    container_name: monica-web
    ports:
      - "8088:80"
    depends_on:
      - app
    volumes:
      - data:/var/www/html/storage:ro
    restart: always
    networks:
      - monica_network

  db:
    image: mariadb:11
    container_name: monica-db
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=monica
      - MYSQL_USER=monica
      - MYSQL_PASSWORD=secret
    volumes:
      - mysql:/var/lib/mysql
    restart: always
    networks:
      - monica_network

volumes:
  data:
    driver: local
  mysql:
    driver: local