version: "3.8"

networks:
  qbittorrent_network:
    driver: bridge
    name: qbittorrent_network

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    env_file:
      - ./env_files/qbittorrent.env
    volumes:
      - ~/apps_data/qbittorrent_config:/config
      - ~/media:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - qbittorrent_network