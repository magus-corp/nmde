version: "3.8"

networks:
  veloren_network:
    driver: bridge
    name: veloren_network

services:
  game-server:
    image: registry.gitlab.com/veloren/veloren/server-cli:weekly
    stdin_open: true
    tty: true
    container_name: veloren-game-server-master
    ports:
      - "14004:14004"
      - "14005:14005"
    restart: on-failure:0
    volumes:
        - "./userdata:/opt/userdata"
    env_file:
        - ./env_files/veloren.env
    networks:
      - veloren_network

  watchtower:
    image: containrrr/watchtower
    container_name: veloren-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --stop-timeout 130s --cleanup veloren-game-server-master
    restart: on-failure:0
    networks:
      - veloren_network